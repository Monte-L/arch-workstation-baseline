format = "$username@$hostname $directory$git_branch$git_status$python $character"

[username]
style_user = "bold #7aa2f7"
style_root = "bold #f7768e"
show_always = true
format = "[$user]($style)"

[hostname]
style = "bold #bb9af7"
format = "[@$hostname]($style)"

[directory]
style = "bold #9ece6a"
truncation_length = 3
format = "[ $path]($style) "

[git_branch]
symbol = " "
style = "#e0af68"
format = "[$symbol$branch]($style) "

[git_status]
style = "#f7768e"
format = "[$all_status$ahead_behind]($style) "

[python]
symbol = " "
style = "#7aa2f7"
format = "[$symbol$version]($style) "

[character]
success_symbol = "[❯](#9ece6a)"
error_symbol = "[❯](#f7768e)"
